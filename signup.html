<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Blissora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="bg-light">
  <!-- ======= NAVIGATION BAR ======= -->
  <header class="header">
    <nav class="navbar">
      <a href="bliss.html" class="navbar-logo">
        <img src="images/logo2.jpg" alt="Blissora Logo">
      </a>
      <div class="hamburger" id="hamburgerMenu" aria-label="Open navigation" tabindex="0">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="bliss.html#home">Home</a></li>
        <li><a href="discover.html">Our Story</a></li>
        <li><a href="collections.html">Collections</a></li>
        <li><a href="game.html">Play Game</a></li>
        <li><a href="contact.html">Connect us</a></li>
      </ul>
      <div class="cta-buttons">
        <button class="dark-mode-toggle"><i class="fas fa-moon"></i></button>
        <a href="wishlist.html" class="wishlist-icon" title="Wishlist"><i class="fas fa-heart"></i></a>
        <a href="signup.html" class="signup-btn animated-btn">Sign Up / Login</a>
        <a href="cart.html" class="cart-icon" title="Cart">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-count">0</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- ======= SIGNUP FORM ======= -->
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow p-4" style="max-width: 400px; width: 100%; margin-top: 60px;">
      <h2 class="mb-4 text-center">Create an Account</h2>
      <form id="signup-form">
        <div class="mb-3">
          <label for="signup-name" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="signup-name" required />
        </div>
        <div class="mb-3">
          <label for="signup-email" class="form-label">Email</label>
          <input type="email" class="form-control" id="signup-email" required />
        </div>
        <div class="mb-3">
          <label for="signup-password" class="form-label">Password</label>
          <input type="password" class="form-control" id="signup-password" required />
        </div>
        <button class="btn btn-primary w-100" type="submit" id="signup-btn">Sign Up</button>
        <div id="signup-feedback" style="margin-top:1rem;"></div>
        <div class="mt-3 text-center">
          <span>Already have an account? <a href="login.html">Login</a></span>
        </div>
      </form>
    </div>
  </div>

  <!-- ======= FOOTER ======= -->
  <footer class="footer">
    <div class="container footer-container">
      <div class="footer-brand">
        <h3>Blissora</h3>
        <p>Convertible Heels that Match Your Mood.</p>
      </div>
      <div class="footer-links">
        <h4>Quick Links</h4>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="product.html">Products</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="index.html#about">About</a></li>
        </ul>
      </div>
      <div class="footer-social">
        <h4>Connect With Us</h4>
        <div class="social-icons">
          <a href="https://www.instagram.com/blissora.in" target="_blank"><i class="fab fa-instagram"></i></a>
          <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
          <a href="https://wa.me" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
      </div>
    </div>
    <p class="footer-bottom">&copy; 2025 Blissora. All rights reserved.</p>
  </footer>

  <script>
    // Mobile menu toggle
    document.addEventListener('DOMContentLoaded', function () {
      const hamburger = document.getElementById('hamburgerMenu');
      const navLinks = document.getElementById('navLinks');
      if (hamburger && navLinks) {
        hamburger.addEventListener('click', function () {
          hamburger.classList.toggle('active');
          navLinks.classList.toggle('show');
        });
        navLinks.querySelectorAll('a').forEach(function (link) {
          link.addEventListener('click', function () {
            hamburger.classList.remove('active');
            navLinks.classList.remove('show');
          });
        });
      }
    });

    // Signup form handler
    const signupForm = document.getElementById('signup-form');
    const signupBtn = document.getElementById('signup-btn');
    const feedbackDiv = document.getElementById('signup-feedback');
    signupForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      feedbackDiv.textContent = '';
      feedbackDiv.className = '';
      signupBtn.disabled = true;
      signupBtn.textContent = 'Signing Up...';
      try {
        const res = await fetch('http://localhost:5000/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Signup failed');
        feedbackDiv.textContent = 'Signup successful! Redirecting to login...';
        feedbackDiv.className = 'alert alert-success';
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      } catch (err) {
        feedbackDiv.textContent = err.message;
        feedbackDiv.className = 'alert alert-danger';
      } finally {
        signupBtn.disabled = false;
        signupBtn.textContent = 'Sign Up';
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
